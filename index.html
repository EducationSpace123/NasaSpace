<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA - Cổng Không Gian & Trò Chơi Trắc Nghiệm Đầy Đủ</title>
    <style>
        :root {
            --bg-color: #0b0d19;
            --text-color: #f0f4f8;
            --card-bg: rgba(11, 61, 145, 0.2);
            --card-border: rgba(11, 61, 145, 0.4);
            --nasa-blue: #0b3d91;
            --nasa-red: #fc3d21;
            --accent-glow: rgba(11, 61, 145, 0.6);
            --option-bg: rgba(11, 61, 145, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f4f7fc;
            --text-color: #101820;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(11, 61, 145, 0.25);
            --nasa-blue: #0b3d91;
            --nasa-red: #d92b12;
            --accent-glow: rgba(11, 61, 145, 0.2);
            --option-bg: rgba(11, 61, 145, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px auto;
            padding: 15px 20px;
            border-bottom: 3px solid var(--nasa-blue);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nasa-badge {
            background: var(--nasa-blue);
            color: white;
            padding: 10px 18px;
            font-weight: 900;
            border-radius: 6px;
            letter-spacing: 2px;
            border: 2px solid var(--nasa-red);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--nasa-blue);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn:hover {
            background: var(--nasa-blue);
            color: white;
            transform: translateY(-2px);
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Nút lựa chọn chế độ lớn (Trò chơi 20 câu / Khám phá hành tinh) */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: var(--card-bg);
            border: 2px solid var(--nasa-blue);
            color: var(--text-color);
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .mode-btn.active, .mode-btn:hover {
            background: var(--nasa-red);
            border-color: var(--nasa-red);
            color: white;
            box-shadow: 0 0 15px var(--nasa-red);
        }

        /* PHẦN TRÒ CHƠI 20 CÂU */
        .game-section {
            display: block;
        }

        .game-container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--nasa-red);
        }

        .question-box {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--option-bg);
            border: 1px solid var(--nasa-blue);
            color: var(--text-color);
            padding: 14px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.98rem;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--nasa-blue);
            color: white;
            border-color: var(--nasa-red);
        }

        .option-btn.correct { background: #28a745 !important; color: white !important; border-color: #28a745 !important; }
        .option-btn.wrong { background: #dc3545 !important; color: white !important; border-color: #dc3545 !important; }

        .explanation-box {
            display: none;
            background: rgba(11, 61, 145, 0.1);
            border-left: 4px solid var(--nasa-red);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .next-btn {
            display: none;
            background: var(--nasa-red);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        /* PHẦN KHÁM PHÁ HÀNH TINH ĐƠN LẬP */
        .explore-section {
            display: none;
        }

        .planet-nav {
            max-width: 1100px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .nav-tab {
            background: var(--bg-color);
            border: 1px solid var(--nasa-blue);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .nav-tab:hover, .nav-tab.active {
            background: var(--nasa-red);
            border-color: var(--nasa-red);
            color: white;
            box-shadow: 0 0 12px var(--nasa-red);
        }

        .planet-page {
            max-width: 1100px;
            margin: 0 auto;
            display: none;
        }

        .planet-page.active {
            display: block;
        }

        .planet-header-card {
            background: var(--card-bg);
            border: 2px solid var(--nasa-blue);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .planet-header-card h2 {
            font-size: 2.2rem;
            color: var(--nasa-red);
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-human { background: rgba(0, 180, 216, 0.2); color: #00b4d8; border: 1px solid #00b4d8; }
        .status-robot { background: rgba(255, 183, 3, 0.2); color: #ffb703; border: 1px solid #ffb703; }
        .status-none { background: rgba(239, 35, 60, 0.2); color: #ef233c; border: 1px solid #ef233c; }

        .planet-desc {
            font-size: 1.05rem;
            line-height: 1.6;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto 20px auto;
        }

        /* Nút Like / Dislike */
        .feedback-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--card-border);
        }

        .feedback-btn {
            background: var(--bg-color);
            border: 1px solid var(--nasa-blue);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feedback-btn:hover {
            border-color: var(--nasa-red);
            background: rgba(252, 61, 33, 0.1);
        }

        .feedback-msg {
            font-size: 0.85rem;
            color: #28a745;
            font-weight: bold;
            display: none;
            margin-top: 8px;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">
            <div class="nasa-badge">NASA</div>
            <h1>Cổng Không Gian Đầy Đủ & Trò Chơi Trắc Nghiệm</h1>
        </div>
        <div>
            <button class="btn" onclick="toggleTheme()">☀️ / 🌙 Giao Diện</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Chuyển đổi giữa chế độ Chơi Trắc Nghiệm 20 Câu và Khám Phá Từng Hành Tinh -->
        <div class="mode-selector">
            <button class="mode-btn active" id="btnGameMode" onclick="switchMainMode('game')">🎮 Trò Chơi Trắc Nghiệm (20 Câu)</button>
            <button class="mode-btn" id="btnExploreMode" onclick="switchMainMode('explore')">🪐 Khám Phá Từng Hành Tinh</button>
        </div>

        <!-- 1. PHẦN TRÒ CHƠI 20 CÂU -->
        <div class="game-section" id="gameSection">
            <div class="game-container">
                <div id="quizScreen">
                    <div class="game-header">
                        <span id="questionCounter">Câu hỏi 1/20</span>
                        <span id="scoreTracker">Điểm: 0</span>
                    </div>
                    <div class="question-box" id="questionText">Đang tải câu hỏi...</div>
                    <div class="options-grid" id="optionsContainer"></div>
                    
                    <div class="explanation-box" id="explanationBox"></div>
                    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Tiếp tục câu hỏi tiếp theo →</button>
                </div>

                <div class="result-screen" id="resultScreen">
                    <h2 style="color: var(--nasa-red); margin-bottom: 15px;">Hoàn Thành Sứ Mệnh 20 Câu!</h2>
                    <p id="finalScoreText" style="font-size: 1.1rem; margin-bottom: 20px;"></p>
                    <button class="btn" onclick="restartGame()" style="padding: 12px 25px;">Chơi Lại Từ Đầu</button>
                </div>
            </div>
        </div>

        <!-- 2. PHẦN KHÁM PHÁ HÀNH TINH ĐƠN LẬP (CÓ LIKE/DISLIKE) -->
        <div class="explore-section" id="exploreSection">
            <div class="planet-nav" id="planetNav"></div>
            <div id="pagesContainer"></div>
        </div>
    </div>

    <script>

                options: ["A. Mịn và mềm như nhung", "B. Sắc nhọn như mảnh thủy tinh nhỏ", "C. Chứa chất độc thần kinh dạng khí", "D. Tự phát nổ khi gặp ánh sáng"],

                explanation: "Bụi Regolith trên Mặt Trăng 🌕 rất sắc nhọn do không bị bào mòn bởi gió, gây mài mòn thiết bị nghiêm trọng."
            },
            {
                question: "11. Tàu vũ trụ duy nhất trong lịch sử từng bay lướt qua Sao Thiên Vương 🔵 và Sao Hải Vương 🌊 là gì?",
                options: ["A. Voyager 2", "B. Pioneer 10", "C. Curiosity", "D. Opportunity"],
                correct: 0,
                explanation: "Voyager 2 là tàu thám hiểm duy nhất bay lướt qua hai hành tinh băng giá vòng ngoài này vào thập niên 80."
            },
            {
                question: "12. Yếu tố nào sau đây gây cản trở lớn nhất cho việc truyền thông tin liên hành tinh từ Sao Hải Vương 🌊 về Trái Đất 🌍?",
                options: ["A. Sóng phát ra bị đóng băng", "B. Độ trễ tín hiệu lên tới hàng giờ và tín hiệu cực kỳ yếu", "C. Bị hành tinh khác nuốt trọn sóng", "D. Tốc độ ánh sáng bị chậm lại"],
                correct: 1,
                explanation: "Do khoảng cách quá xa, độ trễ tín hiệu mất nhiều giờ và cường độ tín hiệu suy giảm nghiêm trọng."
            },
            {
                question: "13. Tên loại vi mạch siêu bền được nghiên cứu để giúp thiết bị điện tử sống sót trong môi trường nhiệt độ cực cao của Sao Kim ♀️ là gì?",
                options: ["A. Silicon-Carbide", "B. Đồng nguyên chất", "C. Nhôm dẻo chịu nhiệt", "D. Thạch anh lỏng"],
                correct: 0,
                explanation: "Vi mạch làm từ Silicon-carbide giúp thiết bị không bị phá hủy dưới nhiệt độ 465°C của Sao Kim ♀️."
            },
            {
                question: "14. Vấn đề 'Rác thải quỹ đạo' xung quanh Trái Đất 🌍 nguy hiểm như thế nào đối với các vệ tinh?",
                options: ["A. Làm ô nhiễm nguồn nước biển", "B. Gây cản trở ánh sáng mặt trời chiếu xuống", "C. Chuyển động tốc độ siêu cao có thể đâm thủng tàu vũ trụ", "D. Làm Trái Đất lệch khỏi quỹ đạo quay"],
                correct: 2,
                explanation: "Rác thải quỹ đạo bay với vận tốc ~28.000 km/h, có sức công phá cực lớn khi va chạm."
            },
            {
                question: "15. Công nghệ In 3D ngoài hành tinh dự kiến sử dụng nguyên liệu chính nào có sẵn trên bề mặt Sao Hỏa 🔴?",
                options: ["A. Nhựa tổng hợp", "B. Đất đá bụi Regolith địa phương", "C. Cát thạch anh mịn", "D. Gỗ hóa thạch"],
                correct: 1,
                explanation: "Robot sẽ tận dụng bụi đất đá Regolith ngay tại chỗ để in ra các cấu trúc vòm nhà trú ẩn."
            },
            {
                question: "16. Chính sách 'Bảo vệ hành tinh' (Planetary Protection) trong không gian nhằm mục đích gì?",
                options: ["A. Ngăn chặn vi khuẩn Trái Đất làm ô nhiễm thế giới khác và ngược lại", "B. Bảo vệ các phi hành gia khỏi người ngoài hành tinh", "C. Không cho phép tên lửa phóng qua các vành đai sao", "D. Giữ gìn vẻ đẹp tự nhiên của các hành tinh"],
                correct: 0,
                explanation: "Quy chuẩn kiểm định sinh học nghiêm ngặt để tránh mang mầm bệnh chéo giữa các thiên thể."
            },
            {
                question: "17. Tại sao bề mặt Sao Thủy ☿️ lại có biên độ nhiệt thay đổi cực kỳ khủng khiếp giữa ngày và đêm?",
                options: ["A. Do nó quay quá nhanh xung quanh tâm", "B. Do không có lớp khí quyển dày để giữ nhiệt", "C. Do bề mặt cấu tạo toàn bằng than chì", "D. Do nằm quá gần các tiểu hành tinh"],
                correct: 1,
                explanation: "Vì không có tầng khí quyển giữ nhiệt, mặt ban ngày của Sao Thủy rất nóng còn ban đêm đóng băng sâu."
            },
            {
                question: "18. Hệ thống động cơ đẩy nào được kỳ vọng sẽ rút ngắn thời gian đi đến các hành tinh ngoài từ nhiều năm xuống còn vài tuần?",
                options: ["A. Động cơ hơi nước áp suất cao", "B. Động cơ đẩy nhiệt và ion hạt nhân", "C. Động cơ cánh quạt từ trường", "D. Động cơ buồm gió mặt trời cỡ lớn"],
                correct: 1,
                explanation: "Động cơ hạt nhân cung cấp năng lượng cực lớn giúp tăng tốc độ di chuyển vượt trội trong không gian sâu."
            },
            {
                question: "19. Tàu thám hiểm nào nổi tiếng với sứ mệnh bay lượn qua các khe hở vành đai băng giá của Sao Thổ 🪐?",
                options: ["A. Cassini", "B. Sputnik", "C. Hubble", "D. James Webb"],
                correct: 0,
                explanation: "Tàu Cassini đã hoàn thành xuất sắc các quỹ đạo hiểm hóc quanh hệ thống vành đai Sao Thổ 🪐."
            },
            {
                question: "20. Mục đích chính của việc phóng các sứ mệnh nghiên cứu Tiểu hành tinh cận Trái Đất (NEO) là gì?",
                options: ["A. Khai thác vàng bạc đem về làm giàu", "B. Tính toán quỹ đạo và thử nghiệm phương án phòng thủ va chạm", "C. Đưa tiểu hành tinh về làm vệ tinh thứ hai cho Trái Đất", "D. Biến tiểu hành tinh thành trạm tiếp nhiên liệu"],
                correct: 1,
                explanation: "Giúp nhân loại phát hiện sớm và có giải pháp làm chệch hướng các vật thể nguy hiểm có nguy cơ va chạm Trái Đất 🌍."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // Chuyển đổi qua lại giữa chế độ Chơi Trắc Nghiệm và Khám Phá Hành Tinh
        function switchMainMode(mode) {
            const btnGame = document.getElementById('btnGameMode');
            const btnExplore = document.getElementById('btnExploreMode');
            const gameSec = document.getElementById('gameSection');
            const exploreSec = document.getElementById('exploreSection');

            if(mode === 'game') {
                btnGame.classList.add('active');
                btnExplore.classList.remove('active');
                gameSec.style.display = 'block';
                exploreSec.style.display = 'none';
            } else {
                btnExplore.classList.add('active');
                btnGame.classList.remove('active');
                gameSec.style.display = 'none';
                exploreSec.style.display = 'block';
            }
        }

        // Logic Trò Chơi Trắc Nghiệm 20 Câu
        function loadQuestion() {
            answered = false;
            const currentQ = quizData[currentQuestionIndex];
            
            document.getElementById('questionCounter').innerText = `Câu hỏi ${currentQuestionIndex + 1}/${quizData.length}`;
            document.getElementById('scoreTracker').innerText = `Điểm: ${score}`;
            document.getElementById('questionText').innerText = currentQ.question;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanationBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function selectOption(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;

            const currentQ = quizData[currentQuestionIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIndex === currentQ.correct) {
                btnElement.classList.add('correct');
                score += 5;
            } else {
                btnElement.classList.add('wrong');
                allBtns[currentQ.correct].classList.add('correct');
            }

            allBtns.forEach(btn => btn.disabled = true);

            const expBox = document.getElementById('explanationBox');
            expBox.innerHTML = `<strong>💡 Kiến thức NASA:</strong> ${currentQ.explanation}`;
            expBox.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                document.getElementById('quizScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';
                document.getElementById('finalScoreText').innerText = `Bạn đã hoàn thành xuất sắc chuỗi 20 câu hỏi thử thách không gian với tổng điểm: ${score} / 100 điểm!`;
            }
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('quizScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';
            loadQuestion();
        }

        // Khởi tạo phần Khám Phá Từng Hành Tinh
        function initExploreApp() {
            const navContainer = document.getElementById('planetNav');
            const pagesContainer = document.getElementById('pagesContainer');

            celestialData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-tab ${index === 0 ? 'active' : ''}`;
                btn.innerText = item.name;
                btn.onclick = () => switchPlanetPage(item.id, btn);
                navContainer.appendChild(btn);

                const page = document.createElement('div');
                page.className = `planet-page ${index === 0 ? 'active' : ''}`;
                page.id = `page-${item.id}`;

                page.innerHTML = `
                    <div class="planet-header-card">
                        <h2>${item.name}</h2>
                        <div class="status-badge ${item.status}">${item.statusText}</div>
                        <p class="planet-desc">${item.desc}</p>
                        
                        <!-- Nút Like / Dislike -->
                        <div class="feedback-container">
                            <button class="feedback-btn" onclick="handleFeedback('${item.id}', 'like')">👍 Thích (<span id="like-count-${item.id}">15</span>)</button>
                            <button class="feedback-btn" onclick="handleFeedback('${item.id}', 'dislike')">👎 Không thích (<span id="dislike-count-${item.id}">0</span>)</button>
                        </div>
                        <div class="feedback-msg" id="msg-${item.id}">Cảm ơn bạn đã đánh giá về ${item.name}!</div>
                    </div>
                `;
                pagesContainer.appendChild(page);
            });
        }

        function switchPlanetPage(planetId, btnElement) {
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.planet-page').forEach(p => p.classList.remove('active'));

            btnElement.classList.add('active');
            document.getElementById(`page-${planetId}`).classList.add('active');
        }

        function handleFeedback(planetId, type) {
            const countSpan = document.getElementById(`${type}-count-${planetId}`);
            let currentVal = parseInt(countSpan.innerText);
            countSpan.innerText = currentVal + 1;

            const msgBox = document.getElementById(`msg-${planetId}`);
            msgBox.style.display = 'block';
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 2500);
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        // Chạy khởi động hệ thống
        loadQuestion();
        initExploreApp();
    </script>
</body>
