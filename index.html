<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA - Cổng Không Gian & Trò Chơi Trắc Nghiệm Toàn Diện</title>
    <style>
        :root {
            --bg-color: #050714;
            --text-color: #f0f4f8;
            --card-bg: rgba(11, 61, 145, 0.25);
            --card-border: rgba(30, 144, 255, 0.3);
            --nasa-blue: #0b3d91;
            --nasa-red: #fc3d21;
            --accent-glow: rgba(30, 144, 255, 0.4);
            --option-bg: rgba(11, 61, 145, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f4f7fc;
            --text-color: #101820;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(11, 61, 145, 0.25);
            --nasa-blue: #0b3d91;
            --nasa-red: #d92b12;
            --accent-glow: rgba(11, 61, 145, 0.2);
            --option-bg: rgba(11, 61, 145, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #101b3b 0%, var(--bg-color) 70%);
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 25px auto;
            padding: 15px 25px;
            border-bottom: 2px solid rgba(30, 144, 255, 0.2);
            flex-wrap: wrap;
            gap: 15px;
            background: var(--card-bg);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nasa-badge {
            position: relative;
            background: linear-gradient(135deg, #0b3d91, #1d4ed8);
            color: white;
            padding: 10px 20px;
            font-weight: 900;
            font-size: 1.3rem;
            border-radius: 8px;
            letter-spacing: 3px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(11, 61, 145, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .nasa-subtext {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            font-weight: 600;
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn:hover {
            background: var(--nasa-blue);
            color: white;
            border-color: var(--nasa-red);
            transform: translateY(-2px);
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            color: var(--text-color);
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        .mode-btn.active, .mode-btn:hover {
            background: var(--nasa-red);
            border-color: var(--nasa-red);
            color: white;
            box-shadow: 0 0 15px rgba(252, 61, 33, 0.6);
        }

        /* PHẦN TRÒ CHƠI 20 CÂU */
        .game-section {
            display: block;
        }

        .game-container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--nasa-red);
        }

        .question-box {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--option-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 14px 18px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 0.98rem;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--nasa-blue);
            color: white;
            border-color: var(--nasa-red);
        }

        .option-btn.correct { background: #28a745 !important; color: white !important; border-color: #28a745 !important; }
        .option-btn.wrong { background: #dc3545 !important; color: white !important; border-color: #dc3545 !important; }

        .explanation-box {
            display: none;
            background: rgba(11, 61, 145, 0.15);
            border-left: 4px solid var(--nasa-red);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .next-btn {
            display: none;
            background: var(--nasa-red);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 0 10px rgba(252, 61, 33, 0.4);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        /* PHẦN KHÁM PHÁ HÀNH TINH CHI TIẾT */
        .explore-section {
            display: none;
        }

        .planet-nav {
            max-width: 1100px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .nav-tab {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tab:hover, .nav-tab.active {
            background: var(--nasa-red);
            border-color: var(--nasa-red);
            color: white;
            box-shadow: 0 0 12px rgba(252, 61, 33, 0.6);
        }

        .planet-page {
            max-width: 1100px;
            margin: 0 auto;
            display: none;
        }

        .planet-page.active {
            display: block;
        }

        .planet-header-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            margin-bottom: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .planet-header-card h2 {
            font-size: 2.3rem;
            color: var(--nasa-red);
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-human { background: rgba(0, 180, 216, 0.2); color: #00b4d8; border: 1px solid #00b4d8; }
        .status-robot { background: rgba(255, 183, 3, 0.2); color: #ffb703; border: 1px solid #ffb703; }
        .status-none { background: rgba(239, 35, 60, 0.2); color: #ef233c; border: 1px solid #ef233c; }

        .planet-desc {
            font-size: 1.05rem;
            line-height: 1.8;
            opacity: 0.95;
            max-width: 900px;
            margin: 0 auto 20px auto;
            text-align: justify;
        }

        .feedback-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--card-border);
        }

        .feedback-btn {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feedback-btn:hover {
            border-color: var(--nasa-red);
            background: rgba(252, 61, 33, 0.1);
        }

        .feedback-msg {
            font-size: 0.85rem;
            color: #28a745;
            font-weight: bold;
            display: none;
            margin-top: 8px;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">
            <div class="nasa-badge">NASA</div>
            <div>
                <div style="font-weight: 700; font-size: 1rem; letter-spacing: 0.5px;">Hệ Thống Không Gian</div>
                <div class="nasa-subtext">Space Exploration Portal</div>
            </div>
        </div>
        <div>
            <button class="btn" onclick="toggleTheme()">☀️ / 🌙 Giao Diện</button>
        </div>
    </header>

    <div class="main-container">
        <div class="mode-selector">
            <button class="mode-btn active" id="btnGameMode" onclick="switchMainMode('game')">🎮 Trò Chơi Trắc Nghiệm (20 Câu)</button>
            <button class="mode-btn" id="btnExploreMode" onclick="switchMainMode('explore')">🪐 Khám Phá Từng Hành Tinh</button>
        </div>

        <!-- 1. PHẦN TRÒ CHƠI 20 CÂU -->
        <div class="game-section" id="gameSection">
            <div class="game-container">
                <div id="quizScreen">
                    <div class="game-header">
                        <span id="questionCounter">Câu hỏi 1/20</span>
                        <span id="scoreTracker">Điểm: 0</span>
                    </div>
                    <div class="question-box" id="questionText">Đang tải câu hỏi...</div>
                    <div class="options-grid" id="optionsContainer"></div>
                    
                    <div class="explanation-box" id="explanationBox"></div>
                    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Tiếp tục câu hỏi tiếp theo →</button>
                </div>

                <div class="result-screen" id="resultScreen">
                    <h2 style="color: var(--nasa-red); margin-bottom: 15px;">Hoàn Thành Sứ Mệnh 20 Câu!</h2>
                    <p id="finalScoreText" style="font-size: 1.1rem; margin-bottom: 20px;"></p>
                    <button class="btn" onclick="restartGame()" style="padding: 12px 25px;">Chơi Lại Từ Đầu</button>
                </div>
            </div>
        </div>

        <!-- 2. PHẦN KHÁM PHÁ TỪNG HÀNH TINH CHI TIẾT 10 DÒNG -->
        <div class="explore-section" id="exploreSection">
            <div class="planet-nav" id="planetNav"></div>
            <div id="pagesContainer"></div>
        </div>
    </div>

    <script>
        // Dữ liệu chi tiết hành tinh viết dài mạch lạc khoảng 10 dòng
        const celestialData = [
            {
                id: "sun",
                name: "Mặt Trời",
                icon: "☀️",
                status: "status-none",
                statusText: "🔴 Chưa từng có con người đặt chân (Chỉ có tàu không người lái bay xuyên vành nhật hoa)",
                desc: "Mặt Trời là ngôi sao trung tâm, chiếm giữ tới 99.8% tổng khối lượng toàn bộ Hệ Mặt Trời và là nguồn cung cấp năng lượng, ánh sáng duy trì sự sống cho Trái Đất. Thách thức lớn nhất đối với các nhà khoa học khi nghiên cứu thiên thể này là đối mặt với bức xạ nhiệt khổng lồ và từ trường cực đoan lên tới hàng triệu độ C. Để giải mã bí ẩn về gió mặt trời và bão từ tác động đến lưới điện toàn cầu, NASA đã phải chế tạo và phóng tàu Parker Solar Probe dũng cảm bay thẳng qua vùng vành nhật hoa. Mặc dù nhiệt độ xung quanh vô cùng khắc nghiệt, các lớp khiên gốm bảo vệ chuyên dụng giúp tàu thu thập dữ liệu quý giá mà không bị thiêu rụi. Đây được coi là một trong những bước tiến vĩ đại nhất lịch sử ngành chế tạo thiết bị hàng không vũ trụ hiện đại."
            },
            {
                id: "mercury",
                name: "Sao Thủy",
                icon: "☿️",
                status: "status-robot",
                statusText: "🟡 Robot/Tàu tự hành khảo sát (Chưa có con người đặt chân)",
                desc: "Sao Thủy là hành tinh nhỏ nhất trong hệ mặt trời đồng thời sở hữu vị trí nằm gần Mặt Trời nhất với quỹ đạo chuyển động vô cùng độc đáo. Thách thức cốt lõi khi thám hiểm nơi đây chính là biên độ nhiệt bề mặt thay đổi cực kỳ khốc liệt, dao động từ mức âm 180 độ C lên tới tận 430 độ C chỉ trong một vòng quay. Nguyên nhân chính dẫn đến hiện tượng này là do hành tinh hoàn toàn thiếu vắng một lớp khí quyển dày để giữ nhiệt và phân phối đều năng lượng. Các sứ mệnh như Messenger và BepiColombo đã phải sử dụng vật liệu phản xạ nhiệt tiên tiến để chụp ảnh và lập bản đồ bề mặt chi tiết chứa đầy các hố va chạm. Việc nghiên cứu Sao Thủy giúp nhân loại hiểu rõ hơn về quá trình hình thành của các hành tinh dạng đá nằm ở vùng lõi bên trong hệ thống."
            },
            {
                id: "venus",
                name: "Sao Kim",
                icon: "♀️",
                status: "status-none",
                statusText: "🔴 Chưa từng có con người đặt chân (Áp suất khổng lồ & axit hủy diệt robot)",
                desc: "Sao Kim dù có kích thước và cấu tạo tương đồng với Trái Đất nhưng lại sở hữu một môi trường địa ngục thực sự đáng sợ đối với mọi thiết bị. Thách thức lớn nhất tại đây là áp suất khí quyển khổng lồ gấp 92 lần mặt nước biển kết hợp với nhiệt độ bề mặt lên tới 465 độ C đủ khả năng làm tan chảy chì. Bên cạnh đó, các tầng mây dày đặc bao phủ hành tinh này chủ yếu chứa axit sulfuric có tính ăn mòn cực mạnh phá hủy vật liệu cấu trúc nhanh chóng. Các tàu thăm dò thuộc chương trình Venera trong quá khứ chỉ có thể trụ vững và truyền về vài bức ảnh quý giá trong thời gian ngắn ngủi trước khi bị hỏng hoàn toàn. Hiện nay, các kỹ sư đang nghiên cứu các loại vi mạch chế tạo từ vật liệu Silicon-carbide đặc biệt để hy vọng chế tạo thiết bị sống sót lâu dài."
            },
            {
                id: "earth",
                name: "Trái Đất",
                icon: "🌍",
                status: "status-human",
                statusText: "🟢 Nơi con người sinh sống và làm chủ hoàn toàn",
                desc: "Trái Đất là hành tinh xanh tuyệt đẹp, đồng thời là ngôi nhà duy nhất trong vũ trụ được xác nhận có sự sống phong phú và văn minh nhân loại phát triển. Thách thức cốt lõi mà loài người đang phải đối mặt không chỉ nằm ngoài không gian mà còn ngay tại quỹ đạo cận vệ tinh xung quanh hành tinh này. Vấn đề rác thải quỹ đạo trôi nổi với vận tốc kinh hoàng lên tới 28.000 km/h đe dọa trực tiếp sự an toàn của hàng ngàn vệ tinh viễn thông đắt giá. Ngoài ra, việc duy trì hệ thống hỗ trợ sự sống khép kín đạt tỷ lệ tái chế 98% cùng các chiến lược phòng thủ trước tiểu hành tinh cận kề là ưu tiên tối quan trọng. Trái Đất đóng vai trò là điểm xuất phát duy nhất cho mọi ước mơ vươn ra biển lớn vũ trụ bao la của toàn bộ nhân loại trong tương lai."
            },
            {
                id: "moon",
                name: "Mặt Trăng",
                icon: "🌕",
                status: "status-human",
                statusText: "🟢 Đã có con người đặt chân (Chương trình Apollo lịch sử & Artemis)",
                desc: "Mặt Trăng là vệ tinh tự nhiên duy nhất của Trái Đất, đánh dấu mốc son chói lọi khi phi hành gia Neil Armstrong đặt bước chân đầu tiên trong chương trình Apollo. Thách thức cốt lõi trong kỷ nguyên mới là xây dựng căn cứ trú ẩn dài hạn và đối phó với lớp bụi Regolith sắc nhọn như mảnh thủy tinh. Bụi này không bị gió bào mòn nên cực kỳ bám dính và phá hủy nhanh chóng các khớp nối trang thiết bị, đồng thời đe dọa hệ hô hấp con người. Chương trình Artemis của NASA hiện đang tập trung khai thác nguồn nước đá bị đóng băng ở các hố sâu vùng cực để tạo oxy và nhiên liệu. Mặt Trăng đang được quy hoạch trở thành trạm trung chuyển hoàn hảo để chuẩn bị cho các chuyến bay dài ngày đưa con người tiến sâu hơn tới Sao Hỏa."
            },
            {
                id: "mars",
                name: "Sao Hỏa",
                icon: "🔴",
                status: "status-robot",
                statusText: "🟡 Robot tự hành hoạt động liên tục (Chưa có con người đặt chân)",
                desc: "Sao Hỏa hay còn gọi là Hành tinh Đỏ, là điểm đến tiềm năng nhất cho sứ mệnh thám hiểm có phi hành gia trong thế kỷ này. Thách thức lớn nhất tại đây bao gồm bầu không khí loãng chứa chủ yếu khí CO2, lượng bức xạ vũ trụ nguy hiểm và những cơn bão bụi quy mô toàn hành tinh. Để giải quyết bài toán sinh tồn, NASA đang thử nghiệm công nghệ ISRU nhằm tự động chuyển hóa băng ngầm thành nước sạch và hydro phục vụ nhiên liệu tên lửa. Các xe robot tự hành như Perseverance và Curiosity đang ngày đêm khoan cắt bề mặt để tìm kiếm dấu hiệu của vi khuẩn cổ đại. Việc chinh phục Sao Hỏa đòi hỏi sự hợp tác toàn cầu về công nghệ sinh học không gian và hệ thống năng lượng hạt nhân độc lập vô cùng phức tạp."
            },
            {
                id: "jupiter",
                name: "Sao Mộc",
                icon: "🟠",

        let currentQuestionIndex = 0;
        let score = 0;

        function switchMainMode(mode) {
            const btnGame = document.getElementById('btnGameMode');
            const btnExplore = document.getElementById('btnExploreMode');
            const gameSec = document.getElementById('gameSection');
            const exploreSec = document.getElementById('exploreSection');

            if(mode === 'game') {
                btnGame.classList.add('active');
                btnExplore.classList.remove('active');
                gameSec.style.display = 'block';
                exploreSec.style.display = 'none';
            } else {
                btnExplore.classList.add('active');
                btnGame.classList.remove('active');
                gameSec.style.display = 'none';
                exploreSec.style.display = 'block';
            }
        }

        function loadQuestion() {
            answered = false;
            const currentQ = quizData[currentQuestionIndex];
            
            document.getElementById('questionCounter').innerText = `Câu hỏi ${currentQuestionIndex + 1}/${quizData.length}`;
            document.getElementById('scoreTracker').innerText = `Điểm: ${score}`;
            document.getElementById('questionText').innerText = currentQ.question;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanationBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function selectOption(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;

            const currentQ = quizData[currentQuestionIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIndex === currentQ.correct) {
                btnElement.classList.add('correct');
                score += 5;
            } else {
                btnElement.classList.add('wrong');
                allBtns[currentQ.correct].classList.add('correct');
            }

            allBtns.forEach(btn => btn.disabled = true);

            const expBox = document.getElementById('explanationBox');
            expBox.innerHTML = `<strong>💡 Kiến thức NASA:</strong> ${currentQ.explanation}`;
            expBox.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                document.getElementById('quizScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';
                document.getElementById('finalScoreText').innerText = `Bạn đã hoàn thành xuất sắc chuỗi 20 câu hỏi thử thách không gian với tổng điểm: ${score} / 100 điểm!`;
            }
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('quizScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';
            loadQuestion();
        }

                const page = document.createElement('div');
                page.className = `planet-page ${index === 0 ? 'active' : ''}`;
                page.id = `page-${item.id}`;

                page.innerHTML = `
                    <div class="planet-header-card">
                        <h2>${item.icon} ${item.name}</h2>
                        <div class="status-badge ${item.status}">${item.statusText}</div>
                        <p class="planet-desc">${item.desc}</p>
                        
                        <div class="feedback-container">
                            <button class="feedback-btn" onclick="handleFeedback('${item.id}', 'like')">👍 Thích (<span id="like-count-${item.id}">15</span>)</button>
                            <button class="feedback-btn" onclick="handleFeedback('${item.id}', 'dislike')">👎 Không thích (<span id="dislike-count-${item.id}">0</span>)</button>
                        </div>
                        <div class="feedback-msg" id="msg-${item.id}">Cảm ơn bạn đã đánh giá về ${item.name}!</div>
                    </div>
                `;
                pagesContainer.appendChild(page);
            });
        }

        function switchPlanetPage(planetId, btnElement) {
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.planet-page').forEach(p => p.classList.remove('active'));

            btnElement.classList.add('active');
            document.getElementById(`page-${planetId}`).classList.add('active');
        }

        function handleFeedback(planetId, type) {
            const countSpan = document.getElementById(`${type}-count-${planetId}`);
            let currentVal = parseInt(countSpan.innerText);
            countSpan.innerText = currentVal + 1;

            const msgBox = document.getElementById(`msg-${planetId}`);
            msgBox.style.display = 'block';
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 2500);
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        loadQuestion();
        initExploreApp();
    </script>
</body>
</html>
