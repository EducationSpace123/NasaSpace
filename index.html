<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA - Trò Chơi Trắc Nghiệm 20 Câu & Cổng Dữ Liệu Không Gian</title>
    <style>
        :root {
            --bg-color: #0b0d19;
            --text-color: #f0f4f8;
            --card-bg: rgba(11, 61, 145, 0.2);
            --card-border: rgba(11, 61, 145, 0.4);
            --nasa-blue: #0b3d91;
            --nasa-red: #fc3d21;
            --accent-glow: rgba(11, 61, 145, 0.6);
            --option-bg: rgba(11, 61, 145, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f4f7fc;
            --text-color: #101820;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(11, 61, 145, 0.25);
            --nasa-blue: #0b3d91;
            --nasa-red: #d92b12;
            --accent-glow: rgba(11, 61, 145, 0.2);
            --option-bg: rgba(11, 61, 145, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px auto;
            padding: 15px 20px;
            border-bottom: 3px solid var(--nasa-blue);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nasa-badge {
            background: var(--nasa-blue);
            color: white;
            padding: 10px 18px;
            font-weight: 900;
            border-radius: 6px;
            letter-spacing: 2px;
            border: 2px solid var(--nasa-red);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--nasa-blue);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn:hover {
            background: var(--nasa-blue);
            color: white;
            transform: translateY(-2px);
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: var(--card-bg);
            border: 2px solid var(--nasa-blue);
            color: var(--text-color);
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .mode-btn.active, .mode-btn:hover {
            background: var(--nasa-red);
            border-color: var(--nasa-red);
            color: white;
            box-shadow: 0 0 15px var(--nasa-red);
        }

        /* TRÒ CHƠI TRẮC NGHIỆM */
        .game-section {
            display: block;
        }

        .game-container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--nasa-red);
        }

        .question-box {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--option-bg);
            border: 1px solid var(--nasa-blue);
            color: var(--text-color);
            padding: 14px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.98rem;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--nasa-blue);
            color: white;
            border-color: var(--nasa-red);
        }

        .option-btn.correct { background: #28a745 !important; color: white !important; border-color: #28a745 !important; }
        .option-btn.wrong { background: #dc3545 !important; color: white !important; border-color: #dc3545 !important; }

        .explanation-box {
            display: none;
            background: rgba(11, 61, 145, 0.1);
            border-left: 4px solid var(--nasa-red);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .next-btn {
            display: none;
            background: var(--nasa-red);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        /* PHẦN TRA CỨU THÔNG TIN */
        .explore-section {
            display: none;
        }

        .solar-system {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .solar-system h3 {
            margin-bottom: 12px;
            color: var(--nasa-red);
        }

        .planet-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .planet-btn {
            background: var(--bg-color);
            border: 1px solid var(--nasa-blue);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .planet-btn:hover, .planet-btn.active {
            background: var(--nasa-red);
            border-color: var(--nasa-red);
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            border-color: var(--nasa-red);
            transform: translateY(-5px);
        }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card-number { color: var(--nasa-red); text-transform: uppercase; }
        .planet-tag { background: var(--nasa-blue); color: white; padding: 2px 8px; border-radius: 4px; }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
            display: inline-block;
        }

        .status-human { background: rgba(0, 180, 216, 0.2); color: #00b4d8; border: 1px solid #00b4d8; }
        .status-robot { background: rgba(255, 183, 3, 0.2); color: #ffb703; border: 1px solid #ffb703; }
        .status-none { background: rgba(239, 35, 60, 0.2); color: #ef233c; border: 1px solid #ef233c; }

        .card h3 { font-size: 1.05rem; margin-bottom: 8px; }
        .card p { font-size: 0.85rem; opacity: 0.85; line-height: 1.4; }

        /* Modal Chi Tiết */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-color);
            border: 2px solid var(--nasa-blue);
            padding: 30px;
            border-radius: 14px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 0 25px var(--nasa-blue);
        }

        .modal-content h3 { color: var(--nasa-red); margin-bottom: 12px; }
        .modal-meta { background: var(--card-bg); padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; border-left: 3px solid var(--nasa-red); }
        .close-btn { background: var(--nasa-blue); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .close-btn:hover { background: var(--nasa-red); }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">
            <div class="nasa-badge">NASA</div>
            <h1>Trò Chơi Trắc Nghiệm 20 Câu & Dữ Liệu Không Gian</h1>
        </div>
        <div>
            <button class="btn" onclick="toggleTheme()">☀️ / 🌙 Giao Diện</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Chuyển đổi chế độ -->
        <div class="mode-selector">
            <button class="mode-btn active" id="btnGameMode" onclick="switchMode('game')">🎮 Trò Chơi Trắc Nghiệm (20 Câu)</button>
            <button class="mode-btn" id="btnExploreMode" onclick="switchMode('explore')">📚 Tra Cứu Thách Thức NASA</button>
        </div>

        <!-- 1. TRÒ CHƠI 20 CÂU -->
        <div class="game-section" id="gameSection">
            <div class="game-container">
                <div id="quizScreen">
                    <div class="game-header">
                        <span id="questionCounter">Câu hỏi 1/20</span>
                        <span id="scoreTracker">Điểm: 0</span>
                    </div>
                    <div class="question-box" id="questionText">Đang tải câu hỏi...</div>
                    <div class="options-grid" id="optionsContainer"></div>
                    
                    <div class="explanation-box" id="explanationBox"></div>
                    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Tiếp tục câu hỏi tiếp theo →</button>
                </div>

                <div class="result-screen" id="resultScreen">
                    <h2 style="color: var(--nasa-red); margin-bottom: 15px;">Hoàn Thành Sứ Mệnh 20 Câu!</h2>
                    <p id="finalScoreText" style="font-size: 1.1rem; margin-bottom: 20px;"></p>
                    <button class="btn" onclick="restartGame()" style="padding: 12px 25px;">Chơi Lại Từ Đầu</button>
                </div>
            </div>
        </div>

        <!-- 2. TRA CỨU THÔNG TIN -->
        <div class="explore-section" id="exploreSection">
            <div class="solar-system">
                <h3>Hệ Thống Lọc Thiên Thể Không Gian</h3>
                <div class="planet-container">
                    <button class="planet-btn" onclick="filterPlanet('Mặt Trời')">☀️ Mặt Trời</button>
                    <button class="planet-btn" onclick="filterPlanet('Mặt Trăng')">🌕 Mặt Trăng</button>
                    <button class="planet-btn" onclick="filterPlanet('Sao Thủy')">☿️ Sao Thủy</button>
                    <button class="planet-btn" onclick="filterPlanet('Sao Kim')">♀️ Sao Kim</button>
                    <button class="planet-btn" onclick="filterPlanet('Trái Đất')">🌍 Trái Đất</button>
                    <button class="planet-btn" onclick="filterPlanet('Sao Hỏa')">🔴 Sao Hỏa</button>
                    <button class="planet-btn" onclick="filterPlanet('Sao Mộc')">🟠 Sao Mộc</button>
                    <button class="planet-btn" onclick="filterPlanet('Sao Thổ')">🪐 Sao Thổ</button>
                    <button class="planet-btn" onclick="filterPlanet('Sao Thiên Vương')">🔵 Sao Thiên Vương</button>
                    <button class="planet-btn" onclick="filterPlanet('Sao Hải Vương')">🌊 Sao Hải Vương</button>
                    <button class="btn" style="padding: 4px 10px; font-size: 0.8rem;" onclick="filterAll()">Tất Cả</button>
                </div>
            </div>

            <div class="grid" id="issuesGrid"></div>
        </div>
    </div>

    <!-- Modal Chi Tiết -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h3 id="modalTitle">Tiêu đề</h3>
            <div class="modal-meta" id="modalMeta">Trạng thái...</div>
            <p id="modalDesc" style="font-size: 0.92rem; line-height: 1.5; margin-bottom: 20px;"></p>
            <button class="close-btn" onclick="closeModal()">Đóng Cửa Sổ</button>
        </div>
    </div>

    <script>
        const issues = [
            { id: 1, title: "Khảo sát khí quyển và chịu nhiệt vành nhật hoa", desc: "Tàu Parker Solar Probe đối mặt với bức xạ nhiệt hàng triệu độ C để thu thập dữ liệu nguồn gốc bão từ.", planet: "Mặt Trời", emoji: "☀️", status: "status-none", exploration: "Chưa từng có con người đặt chân (Chỉ có tàu không người lái bay xuyên qua)" },
            { id: 2, title: "Xây dựng trạm trú ẩn và khai thác băng cực Mặt Trăng (Artemis)", desc: "Khắc phục bụi regolith sắc nhọn bám dính thiết bị và khai thác nước đá phục vụ căn cứ dài hạn.", planet: "Mặt Trăng", emoji: "🌕", status: "status-human", exploration: "Đã có con người đặt chân (Chương trình Apollo lịch sử và sắp quay lại)" },
            { id: 3, title: "Bảo vệ vật liệu trước biên độ nhiệt Sao Thủy", desc: "Chênh lệch nhiệt độ bề mặt từ -180°C lên tới 430°C đòi hỏi lớp phủ gốm chịu nhiệt đặc biệt.", planet: "Sao Thủy", emoji: "☿️", status: "status-robot", exploration: "Chưa từng có con người đặt chân (Đã có tàu Messenger và BepiColombo bay quỹ đạo)" },
            { id: 4, title: "Chế tạo thiết bị cơ điện tử sống sót trên Sao Kim", desc: "Áp suất gấp 92 lần Trái Đất và nhiệt độ 465°C làm tan chảy chì trong vài phút. Cần vi mạch silicon-carbide.", planet: "Sao Kim", emoji: "♀️", status: "status-none", exploration: "Chưa từng có con người đặt chân (Tàu Venera từng chụp ảnh vài phút trước khi hỏng)" },
            { id: 5, title: "Quản lý rác thải quỹ đạo và phòng thủ Trái Đất", desc: "Theo dõi hàng triệu mảnh vỡ trôi nổi với vận tốc lớn và tính toán quỹ đạo tiểu hành tinh va chạm.", planet: "Trái Đất", emoji: "🌍", status: "status-human", exploration: "Nơi duy nhất con người đang sinh sống và làm chủ hoàn toàn" },
            { id: 6, title: "Sinh tồn và khai thác tài nguyên tại chỗ (ISRU) trên Sao Hỏa", desc: "Chuyển hóa băng ngầm thành nước sạch và nhiên liệu tên lửa để phi hành gia tự cung tự cấp.", planet: "Sao Hỏa", emoji: "🔴", status: "status-robot", exploration: "Chưa có con người đặt chân (Mới chỉ có các xe robot tự hành hoạt động)" },
            { id: 7, title: "Vượt qua vành đai bức xạ cực mạnh xung quanh Sao Mộc", desc: "Từ trường khổng lồ tạo ra các hạt năng lượng cao phá hủy nhanh chóng vi mạch điện tử.", planet: "Sao Mộc", emoji: "🟠", status: "status-none", exploration: "Chưa từng có con người đặt chân (Khảo sát qua các tàu tự động quỹ đạo)" },
            { id: 8, title: "Điều hướng quỹ đạo qua hệ thống vành đai hạt băng Sao Thổ", desc: "Tránh va chạm với hàng tỷ khối băng chuyển động siêu nhanh khi tàu lao qua khe hở hành tinh.", planet: "Sao Thổ", emoji: "🪐", status: "status-none", exploration: "Chưa từng có con người đặt chân (Khảo sát hoàn toàn bằng tàu Cassini)" },
            { id: 9, title: "Cung cấp năng lượng hạt nhân độc lập tại Sao Thiên Vương", desc: "Ở quá xa Mặt Trời khiến pin mặt trời vô tác dụng, đòi hỏi máy phát nhiệt điện phóng xạ (RTG).", planet: "Sao Thiên Vương", emoji: "🔵", status: "status-none", exploration: "Chưa từng có con người đặt chân (Chỉ có tàu Voyager 2 lướt qua năm 1986)" },
            { id: 10, title: "Giải mã thông tin tầm xa tại biên giới tối tăm Sao Hải Vương", desc: "Độ trễ tín hiệu lên tới hàng giờ chiều đi, cường độ tín hiệu thu về cực kỳ yếu ở vùng ngoài cùng.", planet: "Sao Hải Vương", emoji: "🌊", status: "status-none", exploration: "Chưa từng có con người đặt chân (Chỉ có Voyager 2 lướt qua năm 1989)" }
        ];

        // 20 CÂU HỎI TRẮC NGHIỆM CHUYÊN SÂU
        const quizData = [
            {
                question: "1. Tính đến nay, thiên thể ngoài Trái Đất nào là nơi duy nhất con người từng trực tiếp đặt chân tới?",
                options: ["A. Mặt Trăng 🌕", "B. Sao Hỏa 🔴", "C. Sao Kim ♀️", "D. Trái Đất 🌍"],
                correct: 0,
                explanation: "Mặt Trăng 🌕 là thiên thể duy nhất ngoài Trái Đất mà con người từng đặt chân tới trong chương trình Apollo."
            },
            {
                question: "2. Hành tinh nào trong hệ mặt trời có áp suất khí quyển nghiền nát kim loại và nhiệt độ bề mặt nóng chảy chì (465°C)?",
                options: ["A. Sao Thủy ☿️", "B. Sao Kim ♀️", "C. Sao Mộc 🟠", "D. Sao Hỏa 🔴"],
                correct: 1,
                explanation: "Sao Kim ♀️ có nhiệt độ khắc nghiệt và áp suất khí quyển cực lớn, con người chưa từng đặt chân tới."
            },
            {
                question: "3. Thách thức lớn nhất đối với phi hành gia khi sống dài ngày trong môi trường không trọng lực là gì?",
                options: ["A. Thiếu oxy trầm trọng", "B. Mất mật độ xương và teo cơ", "C. Nhiệt độ cơ thể bị đóng băng", "D. Không nhìn thấy các vì sao"],
                correct: 1,
                explanation: "Thiếu trọng lực khiến xương không phải chịu tải, dẫn đến mất 1-1.5% mật độ xương mỗi tháng."
            },
            {
                question: "4. Hành tinh nào sở hữu lớp từ trường và vành đai bức xạ mạnh nhất, đe dọa các linh kiện điện tử của tàu thám hiểm?",
                options: ["A. Sao Mộc 🟠", "B. Sao Thủy ☿️", "C. Sao Hải Vương 🌊", "D. Sao Thiên Vương 🔵"],
                correct: 0,
                explanation: "Sao Mộc 🟠 có từ trường khổng lồ tạo ra các vành đai bức xạ nguy hiểm bậc nhất hệ mặt trời."
            },
            {
                question: "5. Công nghệ ISRU (Khai thác tài nguyên tại chỗ) chủ yếu được nghiên cứu để ứng dụng trên hành tinh nào?",
                options: ["A. Sao Kim ♀️", "B. Sao Hỏa 🔴", "C. Sao Thổ 🪐", "D. Mặt Trăng 🌕"],
                correct: 1,
                explanation: "ISRU trên Sao Hỏa 🔴 giúp biến băng ngầm thành nước sạch và nhiên liệu tên lửa phục vụ chiều về."
            },
            {
                question: "6. Tàu không gian nào của NASA đã dũng cảm bay sát vùng vành nhật hoa để nghiên cứu Mặt Trời ☀️?",
                options: ["A. Voyager 2", "B. Parker Solar Probe", "C. Cassini", "D. Juno"],
                correct: 1,
                explanation: "Tàu Parker Solar Probe chịu nhiệt độ cực đoan để nghiên cứu trực tiếp khí quyển Mặt Trời ☀️."
            },
            {
                question: "7. Tại sao các tàu thám hiểm đến Sao Thiên Vương 🔵 và Sao Hải Vương 🌊 không thể dùng tấm pin mặt trời thông thường?",
                options: ["A. Vì ở đó quá gần Mặt Trời làm cháy pin", "B. Vì ở đó quá xa, ánh sáng quá yếu", "C. Vì bị gió bụi thổi bay hoàn toàn", "D. Vì pin bị đóng băng không dẫn điện"],
                correct: 1,

                correct: 1,
                explanation: "Giúp nhân loại phát hiện sớm và có giải pháp làm chệch hướng các vật thể nguy hiểm có nguy cơ va chạm Trái Đất 🌍."

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        function switchMode(mode) {
            const btnGame = document.getElementById('btnGameMode');
            const btnExplore = document.getElementById('btnExploreMode');
            const gameSec = document.getElementById('gameSection');
            const exploreSec = document.getElementById('exploreSection');

            if(mode === 'game') {
                btnGame.classList.add('active');
                btnExplore.classList.remove('active');
                gameSec.style.display = 'block';
                exploreSec.style.display = 'none';
            } else {
                btnExplore.classList.add('active');
                btnGame.classList.remove('active');
                gameSec.style.display = 'none';
                exploreSec.style.display = 'block';
                renderIssues(issues);
            }
        }

        function loadQuestion() {
            answered = false;
            const currentQ = quizData[currentQuestionIndex];
            
            document.getElementById('questionCounter').innerText = `Câu hỏi ${currentQuestionIndex + 1}/${quizData.length}`;
            document.getElementById('scoreTracker').innerText = `Điểm: ${score}`;
            document.getElementById('questionText').innerText = currentQ.question;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanationBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function selectOption(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;

            const currentQ = quizData[currentQuestionIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIndex === currentQ.correct) {
                btnElement.classList.add('correct');
                score += 5; 
            } else {
                btnElement.classList.add('wrong');
                allBtns[currentQ.correct].classList.add('correct');
            }

            allBtns.forEach(btn => btn.disabled = true);

            const expBox = document.getElementById('explanationBox');
            expBox.innerHTML = `<strong>💡 Kiến thức NASA:</strong> ${currentQ.explanation}`;
            expBox.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                document.getElementById('quizScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';
                document.getElementById('finalScoreText').innerText = `Bạn đã hoàn thành xuất sắc chuỗi 20 câu hỏi thử thách không gian với tổng điểm: ${score} / 100 điểm!`;
            }
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('quizScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';
            loadQuestion();
        }

        function renderIssues(data) {
            const grid = document.getElementById('issuesGrid');
            grid.innerHTML = '';
            data.forEach(item => {
                let badgeText = "";
                if(item.status === "status-human") badgeText = "🟢 Có con người đặt chân/sinh sống";
                else if(item.status === "status-robot") badgeText = "🟡 Robot/Tàu tự hành";
                else badgeText = "🔴 Chưa từng có con người đặt chân";

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header-info">
                            <span class="card-number">Vấn đề #${item.id}</span>
                            <span class="planet-tag">${item.emoji} ${item.planet}</span>
                        </div>
                        <div class="status-badge ${item.status}">${badgeText}</div>
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                    <div style="font-size:0.75rem; opacity:0.7; margin-top:12px; border-top:1px solid var(--card-border); padding-top:8px;">
                        Nhấn để xem chi tiết thông tin lịch sử →
                    </div>
                `;
                card.onclick = () => openModal(item);
                grid.appendChild(card);
            });
        }

        function filterPlanet(planetName) {
            document.querySelectorAll('.planet-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            const filtered = issues.filter(i => i.planet === planetName);
            renderIssues(filtered);
        }

        function filterAll() {
            document.querySelectorAll('.planet-btn').forEach(btn => btn.classList.remove('active'));
            renderIssues(issues);
        }

        function openModal(item) {
            document.getElementById('modalTitle').innerText = `${item.emoji} Thách thức #${item.id}: ${item.title}`;
            document.getElementById('modalMeta').innerHTML = `<strong>Khu vực:</strong> ${item.planet} | <strong>Trạng thái:</strong> ${item.exploration}`;
            document.getElementById('modalDesc').innerText = `${item.desc}\n\nĐây là bài toán thực tế thuộc hệ thống nghiên cứu không gian sâu của NASA, giúp bạn nắm bắt toàn diện giới hạn công nghệ hiện tại của nhân loại.`;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        // Khởi động hệ thống trò chơi 20 câu
        loadQuestion();
    </script>
