<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA - Thách Thức Khám Phá Không Gian & Hành Tinh</title>
    <style>
        :root {
            --bg-color: #0b0d19;
            --text-color: #ffffff;
            --card-bg: rgba(11, 61, 145, 0.15);
            --card-border: rgba(11, 61, 145, 0.4);
            --nasa-blue: #0b3d91;
            --nasa-red: #fc3d21;
            --accent-glow: rgba(11, 61, 145, 0.6);
        }

        [data-theme="light"] {
            --bg-color: #f4f7fc;
            --text-color: #1a1a1a;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(11, 61, 145, 0.2);
            --nasa-blue: #0b3d91;
            --nasa-red: #fc3d21;
            --accent-glow: rgba(11, 61, 145, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
            padding: 20px;
            border-bottom: 2px solid var(--nasa-blue);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nasa-badge {
            background: var(--nasa-blue);
            color: white;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 2px;
            border: 1px solid var(--nasa-red);
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--nasa-blue);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn:hover {
            background: var(--nasa-blue);
            color: white;
            transform: translateY(-2px);
        }

        .solar-system {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            text-align: center;
        }

        .solar-system h2 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .planet-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .planet-btn {
            background: var(--card-bg);
            border: 1px solid var(--nasa-blue);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .planet-btn:hover, .planet-btn.active {
            background: var(--nasa-red);
            border-color: var(--nasa-red);
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: var(--nasa-blue);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .card:hover {
            border-color: var(--nasa-red);
            transform: translateY(-5px);
        }

        .card-number {
            font-size: 0.8rem;
            color: var(--nasa-red);
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .status-visited { background: rgba(40, 167, 69, 0.2); color: #28a745; border: 1px solid #28a745; }
        .status-unvisited { background: rgba(220, 53, 69, 0.2); color: #dc3545; border: 1px solid #dc3545; }
        .status-human { background: rgba(0, 123, 255, 0.2); color: #007bff; border: 1px solid #007bff; }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 0.9rem;
            opacity: 0.85;
            line-height: 1.4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-color);
            border: 2px solid var(--nasa-blue);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 25px var(--nasa-blue);
        }

        .modal-content h3 {
            color: var(--nasa-red);
            margin-bottom: 15px;
        }

        .close-btn {
            background: var(--nasa-blue);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">
            <div class="nasa-badge">NASA</div>
            <h1>Thách Thức & Sứ Mệnh Không Gian</h1>
        </div>
        <div class="controls">
            <button class="btn" onclick="toggleTheme()">☀️ / 🌙 Đổi Giao Diện</button>
            <button class="btn" onclick="filterAll()">Toàn Bộ Vấn Đề (14)</button>
        </div>
    </header>

    <!-- Hệ mặt trời tương tác -->
    <div class="solar-system">
        <h2>Hệ Mặt Trời & Trạng Thái Thám Hiểm</h2>
        <div class="planet-container">
            <button class="planet-btn" onclick="filterPlanet('Mặt Trời')">Mặt Trời</button>
            <button class="planet-btn" onclick="filterPlanet('Sao Thủy')">Sao Thủy</button>
            <button class="planet-btn" onclick="filterPlanet('Sao Kim')">Sao Kim</button>
            <button class="planet-btn" onclick="filterPlanet('Trái Đất')">Trái Đất</button>
            <button class="planet-btn" onclick="filterPlanet('Sao Hỏa')">Sao Hỏa</button>
            <button class="planet-btn" onclick="filterPlanet('Sao Mộc')">Sao Mộc</button>
            <button class="planet-btn" onclick="filterPlanet('Sao Thổ')">Sao Thổ</button>
            <button class="planet-btn" onclick="filterPlanet('Sao Thiên Vương')">Sao Thiên Vương</button>
            <button class="planet-btn" onclick="filterPlanet('Sao Hải Vương')">Sao Hải Vương</button>
        </div>
    </div>

    <!-- Danh sách 14 vấn đề -->
    <div class="container">
        <h2 class="section-title">14 Thách Thức Công Nghệ Của NASA</h2>
        <div class="grid" id="issuesGrid"></div>
    </div>

    <!-- Modal Chi Tiết -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h3 id="modalTitle">Tiêu đề vấn đề</h3>
            <p id="modalDesc">Nội dung chi tiết...</p>
            <button class="close-btn" onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script>
        const issues = [
            { 
                id: 1, 
                title: "Khảo sát và chịu nhiệt vành nhật hoa", 
                desc: "Đối mặt với bức xạ cực đoan khi phóng tàu bay sát khí quyển Mặt Trời.", 
                planet: "Mặt Trời",
                exploration: "Chưa từng có con người đặt chân (Chỉ có tàu thăm dò không người lái tiếp cận)"
            },
            { 
                id: 2, 
                title: "Bảo vệ thiết bị trước biên độ nhiệt Sao Thủy", 
                desc: "Vượt qua sự chênh lệch nhiệt độ khủng khiếp giữa mặt ban ngày và ban đêm.", 
                planet: "Sao Thủy",
                exploration: "Chưa từng có con người đặt chân (Đã có tàu thăm dò bay qua và ghi hình)"
            },
            { 
                id: 3, 
                title: "Chế tạo thiết bị thám hiểm bề mặt Sao Kim", 
                desc: "Áp suất khí quyển nghiền nát kim loại và axit sulfuric ăn mòn mọi vật liệu.", 
                planet: "Sao Kim",
                exploration: "Chưa từng có con người đặt chân (Tàu thăm dò chỉ trụ được vài tiếng trước khi tan chảy)"
            },
            { 
                id: 4, 
                title: "Quản lý rác thải quỹ đạo và phòng thủ Trái Đất", 
                desc: "Dọn dẹp hàng triệu mảnh vỡ trôi nổi và ngăn chặn tiểu hành tinh va chạm.", 
                planet: "Trái Đất",
                exploration: "Nơi duy nhất con người đang sinh sống và đặt chân hoàn toàn"
            },
            { 
                id: 5, 
                title: "Sinh tồn và định cư lâu dài trên Sao Hỏa", 
                desc: "Giải quyết bài toán bức xạ vũ trụ, bão bụi và tạo ra dưỡng khí từ tài nguyên tại chỗ.", 
                planet: "Sao Hỏa",
                exploration: "Chưa có con người đặt chân (Mới chỉ có các xe tự hành robot NASA hoạt động trên bề mặt)"
            },
            { 
                id: 6, 
                title: "Xuyên thủng bức xạ cực mạnh quanh Sao Mộc", 
                desc: "Lớp từ trường khổng lồ và vành đai bức xạ phá hủy vi mạch điện tử siêu nhanh.", 
                planet: "Sao Mộc",
                exploration: "Chưa từng có con người đặt chân (Chỉ có các tàu thám hiểm bay qua)"
            },
            { 
                id: 7, 
                title: "Thám hiểm hệ thống vành đai phức tạp Sao Thổ", 
                desc: "Điều hướng tàu thám hiểm qua hàng tỷ hạt băng chuyển động tốc độ cao.", 
                planet: "Sao Thổ",
                exploration: "Chưa từng có con người đặt chân (Tàu Cassini từng khảo sát trực tiếp quỹ đạo)"
            },
            { 
                id: 8, 
                title: "Thám hiểm hành tinh băng giá Sao Thiên Vương", 
                desc: "Khoảng cách xa làm suy giảm năng lượng mặt trời, đòi hỏi nguồn điện hạt nhân độc lập.", 
                planet: "Sao Thiên Vương",
                exploration: "Chưa từng có con người đặt chân (Chỉ có một tàu Voyager 2 bay ngang qua năm 1986)"
            },
            { 
                id: 9, 
                title: "Truyền thông liên hành tinh tầm xa Sao Hải Vương", 
                desc: "Độ trễ tín hiệu hàng giờ liền và không gian tối đen ở biên giới Hệ Mặt Trời.", 
                planet: "Sao Hải Vương",
                exploration: "Chưa từng có con người đặt chân (Chưa có tàu nào dừng lại, chỉ có Voyager 2 bay lướt qua)"
            },
            { 
                id: 10, 
                title: "Hệ thống hỗ trợ sự sống khép kín 98%", 
                desc: "Tái chế toàn bộ nước và không khí phục vụ các chuyến bay dài ngày.", 
                planet: "Trái Đất",
                exploration: "Nơi duy nhất con người đang sinh sống và đặt chân hoàn toàn"
            },
            { 
                id: 11, 
                title: "Động cơ đẩy nhiệt và ion hạt nhân", 
                desc: "Rút ngắn thời gian du hành liên hành tinh từ hàng năm xuống còn vài tháng.", 
                planet: "Sao Mộc",
                exploration: "Chưa từng có con người đặt chân (Ứng dụng cho tàu không gian sâu)"
            },
            { 
                id: 12, 
                title: "Tác động vi trọng lực lên cơ thể người", 
                desc: "Ngăn chặn tình trạng mất xương, teo cơ và thoái hóa thị giác của phi hành gia.", 
                planet: "Trái Đất",
                exploration: "Nơi duy nhất con người đang sinh sống và đặt chân hoàn toàn"
            },
            { 
                id: 13, 
                title: "Công nghệ in 3D cấu trúc ngoài Trái Đất", 
                desc: "Sử dụng đất đá tại chỗ (regolith) để tự động xây dựng nhà ở cho phi hành gia.", 
                planet: "Sao Hỏa",
                exploration: "Chưa có con người đặt chân (Đang thử nghiệm công nghệ tự động hóa)"
            },
            { 
                id: 14, 
                title: "Bảo vệ hành tinh (Planetary Protection)", 
                desc: "Ngăn chặn mang vi khuẩn Trái Đất làm ô nhiễm thiên thể khác và ngược lại.", 
                planet: "Sao Thủy",
                exploration: "Chính sách kiểm soát chung cho mọi sứ mệnh không gian"
            }
        ];

        function renderIssues(data) {
            const grid = document.getElementById('issuesGrid');
            grid.innerHTML = '';
            data.forEach(item => {
                let badgeClass = "status-unvisited";
                if(item.exploration.includes("duy nhất con người đang sinh sống")) {
                    badgeClass = "status-human";
                } else if(item.exploration.includes("Chưa có con người đặt chân") || item.exploration.includes("Chưa từng có con người đặt chân")) {
                    badgeClass = "status-unvisited";
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-number">Thách thức #${item.id} • ${item.planet}</div>
                    <div class="status-badge ${badgeClass}">${item.exploration}</div>
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p>
                `;
                card.onclick = () => openModal(item);
                grid.appendChild(card);
            });
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        function filterPlanet(planetName) {
            document.querySelectorAll('.planet-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            const filtered = issues.filter(i => i.planet === planetName);
            renderIssues(filtered);
        }

        function filterAll() {
            document.querySelectorAll('.planet-btn').forEach(btn => btn.classList.remove('active'));
            renderIssues(issues);
        }

        function openModal(item) {
            document.getElementById('modalTitle').innerText = `Thách thức #${item.id}: ${item.title}`;
            document.getElementById('modalDesc').innerText = `${item.desc}\n\n[Trạng thái thám hiểm]: ${item.exploration} (Khu vực: ${item.planet})`;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        // Khởi chạy hiển thị ban đầu
        renderIssues(issues);
    </script>
</body>
</html>
